<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FastAPI Frontend Demo - Enhanced</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif; 
            max-width: 900px; 
            margin: 0 auto; 
            padding: 2rem; 
            background: #f5f7fa;
            color: #333;
            line-height: 1.6;
        }
        
        h1 { 
            text-align: center; 
            color: #2c3e50; 
            margin-bottom: 2rem;
            font-size: 2rem;
        }
        
        .section { 
            background: white;
            padding: 1.5rem; 
            margin-bottom: 1.5rem; 
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        h2 { 
            color: #3498db; 
            margin-bottom: 1rem;
            font-size: 1.3rem;
        }
        
        .form-group {
            margin-bottom: 1rem;
        }
        
        input {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #3498db;
        }
        
        button {
            background: #3498db;
            color: white;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s, transform 0.1s;
        }
        
        button:hover {
            background: #2980b9;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        #response { 
            white-space: pre-wrap; 
            background: #2c3e50; 
            color: #ecf0f1; 
            padding: 1rem; 
            border-radius: 6px; 
            margin-top: 1rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }
        
        #response.show {
            display: block;
        }
        
        .error {
            background: #e74c3c !important;
        }
        
        .success {
            background: #27ae60 !important;
        }
        
        .items-list {
            margin-top: 1rem;
            display: grid;
            gap: 0.5rem;
        }
        
        .item-card {
            background: #f8f9fa;
            padding: 0.75rem;
            border-radius: 6px;
            border-left: 4px solid #3498db;
        }
        
        .item-id {
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            color: #7f8c8d;
        }
        
        .status-badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>
    <h1>🚀 FastAPI ↔ Frontend Communication (Enhanced)</h1>

    <!-- 1. GET all items -->
    <div class="section">
        <h2>📋 GET /items/ (Fetch all items)</h2>
        <button onclick="fetchItems()">Fetch Items</button>
        <div id="response-get-all"></div>
    </div>

    <!-- 2. GET single item by ID -->
    <div class="section">
        <h2>🔍 GET /items/{id} (Fetch single item)</h2>
        <input type="text" id="item-id" placeholder="Enter Item ID (leave empty to fetch first item)" />
        <button onclick="fetchSingleItem()">Fetch Item</button>
        <div id="response-get-one"></div>
    </div>

    <!-- 3. POST create new item -->
    <div class="section">
        <h2>➕ POST /items/ (Create new item)</h2>
        <div class="form-group">
            <input type="text" id="new-name" placeholder="Item Name (required)" required />
        </div>
        <div class="form-group">
            <input type="number" id="new-price" placeholder="Price (required, must be > 0)" step="0.01" min="0.01" required />
        </div>
        <div class="form-group">
            <input type="text" id="new-desc" placeholder="Description (optional)" />
        </div>
        <button onclick="createItem()">Create Item</button>
        <div id="response-post"></div>
    </div>

    <!-- 4. PUT update item -->
    <div class="section">
        <h2>✏️ PUT /items/{id} (Update item)</h2>
        <div class="form-group">
            <input type="text" id="update-id" placeholder="Item ID (required)" />
        </div>
        <div class="form-group">
            <input type="text" id="update-name" placeholder="New Name (leave empty to keep current)" />
        </div>
        <div class="form-group">
            <input type="number" id="update-price" placeholder="New Price (leave empty to keep current)" step="0.01" />
        </div>
        <button onclick="updateItem()">Update Item</button>
        <div id="response-put"></div>
    </div>

    <!-- 5. DELETE item -->
    <div class="section">
        <h2>🗑️ DELETE /items/{id} (Delete item)</h2>
        <input type="text" id="delete-id" placeholder="Item ID to delete" />
        <button onclick="deleteItem()" style="background: #e74c3c;">Delete Item</button>
        <div id="response-delete"></div>
    </div>

    <script>
        const baseURL = "http://127.0.0.1:8000";

        // Helper function to show responses
        function showResponse(elementId, data, isError = false) {
            const element = document.getElementById(elementId);
            element.innerHTML = JSON.stringify(data, null, 2);
            element.className = isError ? 'error show' : 'success show';
        }

        // Helper function to clear response
        function clearResponse(elementId) {
            const element = document.getElementById(elementId);
            element.className = '';
        }

        // --- GET all items ---
        async function fetchItems() {
            try {
                clearResponse("response-get-all");
                const res = await fetch(`${baseURL}/items/`);
                const data = await res.json();
                
                if (!res.ok) {
                    showResponse("response-get-all", data, true);
                    return;
                }
                
                // Display as list of cards
                let html = '<div class="items-list">';
                if (data.length === 0) {
                    html += '<div class="item-card">No items found</div>';
                } else {
                    data.forEach(item => {
                        html += `
                            <div class="item-card">
                                <strong>${item.name}</strong> - $${item.price.toFixed(2)}
                                ${item.description ? `<br><small>${item.description}</small>` : ''}
                                <div class="item-id">ID: ${item.id}</div>
                            </div>`;
                    });
                }
                html += '</div>';
                
                document.getElementById("response-get-all").innerHTML = html;
                document.getElementById("response-get-all").classList.add('success', 'show');
            } catch (err) {
                showResponse("response-get-all", { error: "Network Error", detail: err.message }, true);
            }
        }

        // --- GET single item ---
        async function fetchSingleItem() {
            let id = document.getElementById("item-id").value.trim();
            
            // If no ID provided, try to get the first item from the list
            if (!id) {
                try {
                    const res = await fetch(`${baseURL}/items/`);
                    const data = await res.json();
                    if (data && data.length > 0) {
                        id = data[0].id;
                        document.getElementById("item-id").value = id;
                    } else {
                        showResponse("response-get-one", { error: "No items available" }, true);
                        return;
                    }
                } catch (err) {
                    showResponse("response-get-one", { error: "Network Error", detail: err.message }, true);
                    return;
                }
            }
            
            try {
                clearResponse("response-get-one");
                const res = await fetch(`${baseURL}/items/${id}`);
                const data = await res.json();
                
                if (!res.ok) {
                    showResponse("response-get-one", data, true);
                    return;
                }
                
                showResponse("response-get-one", data);
            } catch (err) {
                showResponse("response-get-one", { error: "Network Error", detail: err.message }, true);
            }
        }

        // --- POST create item ---
        async function createItem() {
            const name = document.getElementById("new-name").value.trim();
            const priceInput = document.getElementById("new-price").value;
            const desc = document.getElementById("new-desc").value.trim() || null;
            
            // Validation
            if (!name) {
                showResponse("response-post", { error: "Validation Error", detail: "Name is required" }, true);
                return;
            }
            
            const price = parseFloat(priceInput);
            if (isNaN(price) || price <= 0) {
                showResponse("response-post", { error: "Validation Error", detail: "Price must be a positive number" }, true);
                return;
            }
            
            try {
                clearResponse("response-post");
                const res = await fetch(`${baseURL}/items/`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name, price, description: desc })
                });
                const data = await res.json();
                
                if (!res.ok) {
                    showResponse("response-post", data, true);
                    return;
                }
                
                showResponse("response-post", data);
                // Clear form and refresh list after creation
                document.getElementById("new-name").value = "";
                document.getElementById("new-price").value = "";
                document.getElementById("new-desc").value = "";
                fetchItems();
            } catch (err) {
                showResponse("response-post", { error: "Network Error", detail: err.message }, true);
            }
        }

        // --- PUT update item ---
        async function updateItem() {
            const id = document.getElementById("update-id").value.trim();
            const name = document.getElementById("update-name").value.trim() || null;
            const priceInput = document.getElementById("update-price").value;
            const price = priceInput ? parseFloat(priceInput) : null;
            
            // Validation
            if (!id) {
                showResponse("response-put", { error: "Validation Error", detail: "Item ID is required" }, true);
                return;
            }
            
            if (!name && price === null) {
                showResponse("response-put", { error: "Validation Error", detail: "At least one field (name or price) must be provided" }, true);
                return;
            }
            
            if (price !== null && (isNaN(price) || price <= 0)) {
                showResponse("response-put", { error: "Validation Error", detail: "Price must be a positive number" }, true);
                return;
            }
            
            try {
                clearResponse("response-put");
                const updateData = {};
                if (name !== null) updateData.name = name;
                if (price !== null) updateData.price = price;
                if (document.getElementById("update-name").value.trim()) {
                    updateData.name = name;
                }
                
                const res = await fetch(`${baseURL}/items/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(updateData)
                });
                const data = await res.json();
                
                if (!res.ok) {
                    showResponse("response-put", data, true);
                    return;
                }
                
                showResponse("response-put", data);
            } catch (err) {
                showResponse("response-put", { error: "Network Error", detail: err.message }, true);
            }
        }

        // --- DELETE item ---
        async function deleteItem() {
            const id = document.getElementById("delete-id").value.trim();
            
            if (!id) {
                showResponse("response-delete", { error: "Validation Error", detail: "Item ID is required" }, true);
                return;
            }
            
            try {
                clearResponse("response-delete");
                const res = await fetch(`${baseURL}/items/${id}`, { method: "DELETE" });
                const data = await res.json();
                
                if (!res.ok) {
                    showResponse("response-delete", data, true);
                    return;
                }
                
                showResponse("response-delete", data);
                // Refresh list after deletion
                fetchItems();
            } catch (err) {
                showResponse("response-delete", { error: "Network Error", detail: err.message }, true);
            }
        }
    </script>
</body>
</html>
